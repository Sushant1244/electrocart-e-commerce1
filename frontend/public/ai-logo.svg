<?xml version="1.0" encoding="UTF-8"?>
<!-- AI logo: gradient circle with stylized AI monogram and a subtle shopping-cart accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ElectroCart AI Logo</title>
  <desc id="desc">A circular gradient badge with a stylized "AI" monogram and shopping cart accent for an e‑commerce AI feature.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="1" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0b3b61" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background circle with subtle shadow -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="440" fill="url(#g)"/>
  </g>

  <!-- Outer ring for subtle depth -->
  <circle cx="512" cy="512" r="440" fill="none" stroke="#ffffff20" stroke-width="6"/>

  <!-- Stylized monogram: A and I -->
  <!-- A is formed by a geometric chevron; I is a rounded bar -->
  <g transform="translate(0, -20)">
    <!-- A (chevron) -->
    <path d="M300 680 L420 340 L540 680 Z" fill="#ffffff" opacity="0.98"/>
    <!-- cutout to make A look like an A (crossbar negative space) -->
    <path d="M360 560 L480 420 L420 420 L360 520 Z" fill="#00c6ff"/>

    <!-- I (rounded bar) -->
    <rect x="580" y="340" width="70" height="360" rx="18" fill="#ffffff" opacity="0.98"/>

    <!-- shopping cart accent: subtle line that weaves into the A to indicate e-commerce -->
    <path d="M440 720 L460 760 L640 760" fill="none" stroke="#ffffffcc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- cart wheel dots -->
    <circle cx="500" cy="760" r="16" fill="#ffffffcc"/>
    <circle cx="620" cy="760" r="16" fill="#ffffffcc"/>
  </g>

  <!-- small highlight for polish -->
  <ellipse cx="380" cy="300" rx="160" ry="40" fill="#ffffff10" />
</svg>
